# electron-builder.yml — how the .dmg and .exe get made (WW-068).
#
# The one line that matters most is asarUnpack. `sharp` is a native .node binary and cannot be
# loaded from inside an asar archive; leaving it packed produces an installer that launches fine
# and then fails on the first image with an error nobody can act on. `@img/*` holds sharp's
# per-platform libvips builds and has to come out with it.
#
# Each platform is built on its own CI runner — sharp's binary is not cross-buildable.

appId: in.wishworks.selleros
productName: WishWorks
directories:
  output: dist
  buildResources: build

files:
  - out/**
  - package.json

asarUnpack:
  - "**/node_modules/sharp/**"
  - "**/node_modules/@img/**"

# Read-only data the app READS at runtime but does not generate. `files:` above covers compiled
# code only, so anything listed here would otherwise simply not be in the installer — and the
# failure is invisible from a Mac, because in development both folders resolve inside the repo.
#   - docs/guides/*.md  the AI prompts, which every prompt panel reads and shows (gui/main.ts DOCS)
#   - categories/       the shared per-category form defaults merged by loadProduct()
# `from` is relative to this file's folder, so docs/ reaches up out of flipkart-autofill/.
extraResources:
  - from: ../docs/guides
    to: docs/guides
    filter: ["*.md"]
  - from: categories
    to: categories
    filter: ["*.json"]

# Where the app looks for updates, and where CI publishes them. GitHub Releases needs no server
# and no account for the person downloading — a release asset is a plain public URL, unlike an
# Actions artifact, which expires in 30 days and demands a GitHub login.
publish:
  provider: github
  owner: vanshkathpalia
  repo: WishWorks
  # LEAVE THIS AS THE DEFAULT `draft`. Setting it to `release` looks like the obvious fix for
  # "the release was invisible" and it is wrong: each platform is built on its own runner, and
  # the way they end up in ONE release is that every job uploads into the same **draft**. Publish
  # the first job's release outright and the second job finds no draft to join and creates a
  # second release — which is exactly what happened on the first v0.1.1, twice.
  # The draft is flipped to published by the `publish` job in build.yml, after both are in.

mac:
  target: dmg
  category: public.app-category.business
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
