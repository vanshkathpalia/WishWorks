# build.yml — make the installers WW-068.
#
# Why two runners and not one: `sharp` ships a compiled native binary per platform, so a build
# made on macOS contains the macOS libvips and installs on Windows only to die on the first
# image. electron-builder cannot cross-compile that. Each installer is built on its own OS.
#
# Vansh is on a Mac and the partner is on Windows, so the .exe can only come from here. It is
# unsigned — Windows SmartScreen will warn on first run and the partner clicks
# "More info" -> "Run anyway". Signing needs a paid certificate; deliberately deferred.
#
# Two outputs, and they are not the same thing. Every build uploads artifacts to the run page,
# which last 30 days and need a GitHub login to download. Only a **tag** publishes to GitHub
# Releases, whose assets are plain public URLs and are what `electron-updater` reads.
#
# How the two platforms end up in ONE release, which took four attempts: they do not publish at
# all. Each runner builds and uploads its files as workflow artifacts; the `publish` job at the
# bottom downloads both sets and makes the release once, in one place. Letting electron-builder
# publish from inside the matrix produced two releases every time — the .exe in one, the .dmg in
# the other, and on the last attempt a release holding nothing but a .blockmap.

name: Build installers

on:
  push:
    branches: [main]
    # A tag is what makes a build a RELEASE: it gets published to GitHub Releases, where the
    # installed apps look for updates. Bump "version" in package.json, tag it v<that>, push the
    # tag. Ordinary pushes to main still build and still upload artifacts, they just do not
    # publish — so most commits never reach the partner, which is the point.
    tags: ["v*"]
  # so a build can be kicked off from the Actions tab without pushing anything
  workflow_dispatch:

# The `publish` job creates the release. Nothing else here writes to the repo.
permissions:
  contents: write

jobs:
  build:
    strategy:
      # one broken platform should still leave the other installer downloadable
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: flipkart-autofill

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: flipkart-autofill/package-lock.json

      - run: npm ci

      # The same two gates that run locally. A red typecheck must not reach the partner's laptop
      # as a working installer.
      - run: npm run typecheck
      - run: npm run typecheck:gui
      - run: npm test

      # NEVER let electron-builder touch GitHub. It was tried twice and split the assets both
      # times — one release with the .exe, another with the .dmg, and once a release containing
      # nothing but a .blockmap. Its publisher wants to own the release object, and two runners
      # cannot both own one. Here each runner only ever writes files to disk; the `publish` job
      # below collects them and makes the release in a single place. Boring and deterministic.
      - run: npm run app:dist -- --publish never
        env:
          # electron-builder tries to sign and notarize on macOS otherwise, which needs an Apple
          # certificate we do not have. Unsigned is the deliberate choice for now.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # sharp is a compiled .node binary and the OS loader cannot open one from inside app.asar.
      # electron-builder.yml unpacks it, but a silent failure here produces an installer that
      # launches, shows the UI, and dies on the first image — the one failure no test catches.
      # Fail the build instead, where it costs nothing.
      - name: sharp must be unpacked, not sealed in the asar
        shell: bash
        run: |
          set -e
          unpacked=$(find dist -type d -name "app.asar.unpacked" | head -1)
          if [ -z "$unpacked" ]; then
            echo "::error::no app.asar.unpacked — asarUnpack did not run"
            find dist -maxdepth 3 -name "*.asar*" || true
            exit 1
          fi
          echo "unpacked at: $unpacked"
          if ! find "$unpacked" -name "*.node" | grep -q .; then
            echo "::error::no .node binary outside the asar — sharp would fail on the first image"
            find "$unpacked" -maxdepth 4 -type d || true
            exit 1
          fi
          echo "native binaries shipped outside the asar:"
          find "$unpacked" -name "*.node"

      # The prompts and the category defaults are read at runtime but built by nobody, so they
      # reach the installer only via extraResources. Missing, the prompt panels show "couldn't
      # read PROMPT-*.md" and — worse, because it is silent — loadProduct() merges no defaults and
      # fills a listing with fields quietly blank. Neither is reproducible on a dev machine, where
      # both folders resolve inside the repo. This is the only gate that can catch it.
      - name: the prompts and category defaults must be in the installer
        shell: bash
        run: |
          set -e
          # materials.json is the third file in this class: absent, the Inventory tab has an
          # empty price list and every line of every kit comes back unpriced. The panel says so
          # loudly rather than showing a wrong total, but a build that cannot cost anything
          # should not reach the partner in the first place.
          for f in docs/guides/PROMPT-meta.md categories/balloon-decoration.defaults.json categories/materials.json; do
            found=$(find dist -ipath "*resources/$f" | head -1)
            if [ -z "$found" ]; then
              echo "::error::$f is not in the package — extraResources did not ship it"
              find dist -ipath "*resources*" -maxdepth 5 -type d || true
              exit 1
            fi
            echo "shipped: $found"
          done

      # Everything the release needs, including the update feeds. `latest.yml` is what tells an
      # installed app a newer version exists; without it the release looks complete and no app
      # ever reacts to it.
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: |
            flipkart-autofill/dist/*.exe
            flipkart-autofill/dist/*.dmg
            flipkart-autofill/dist/*.blockmap
            flipkart-autofill/dist/latest*.yml
          if-no-files-found: error

  # ONE place makes the release, after every platform's files exist. This job is the whole
  # reason the split kept happening: there was no such place before, and two runners were each
  # creating their own release object for the same tag.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The gate that would have caught every version of this bug on the first try: a release
      # without the installer, or without the update feed, must fail the build rather than sit
      # there looking finished. `latest.yml` is Windows' feed and is the one that matters most.
      - name: the release must actually contain an installer and an update feed
        run: |
          set -e
          ls -la dist
          for want in "*.exe" "latest.yml"; do
            if ! compgen -G "dist/$want" > /dev/null; then
              echo "::error::no $want in dist — the release would be unusable"
              exit 1
            fi
          done

      # Delete any release already on this tag before creating it. Re-running the workflow, or
      # re-pushing a moved tag, must converge on one correct release rather than adding another
      # — every stray release so far had to be deleted by hand.
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          for id in $(gh api "repos/$REPO/releases" --paginate --jq ".[] | select(.tag_name==\"$TAG\") | .id"); do
            echo "removing existing release $id for $TAG"
            gh api -X DELETE "repos/$REPO/releases/$id"
          done
          gh release create "$TAG" dist/* \
            --repo "$REPO" \
            --title "$TAG" \
            --notes "Install \`WishWorks Setup\`. Windows will warn that the publisher is unknown — More info, then Run anyway. After this the app updates itself." \
            --latest

      # PROVE the feed resolves. latest.yml names the installer, and GitHub rewrites spaces in
      # an uploaded filename to dots — so the feed can point at a file that is not there and the
      # release still looks perfect. That exact 404 shipped in the first v0.1.1. Ask GitHub for
      # the file the feed names; anything but 200 fails the build.
      - name: the update feed must point at a file that exists
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          for feed in latest.yml latest-mac.yml; do
            [ -f "dist/$feed" ] || continue
            name=$(grep -m1 "url:" "dist/$feed" | sed "s/.*url: *//" | tr -d "\r")
            url="https://github.com/$REPO/releases/download/$TAG/$name"
            code=$(curl -o /dev/null -sL -w "%{http_code}" "$url")
            echo "$feed -> $name : HTTP $code"
            if [ "$code" != "200" ]; then
              echo "::error::$feed points at $name, which is not downloadable (HTTP $code)"
              exit 1
            fi
          done
