# build.yml — make the installers WW-068.
#
# Why two runners and not one: `sharp` ships a compiled native binary per platform, so a build
# made on macOS contains the macOS libvips and installs on Windows only to die on the first
# image. electron-builder cannot cross-compile that. Each installer is built on its own OS.
#
# Vansh is on a Mac and the partner is on Windows, so the .exe can only come from here. It is
# unsigned — Windows SmartScreen will warn on first run and the partner clicks
# "More info" -> "Run anyway". Signing needs a paid certificate; deliberately deferred.
#
# Artifacts, not releases: this uploads the installers to the run page, where they last 30 days.
# Publishing to GitHub Releases is a later step and needs a version bump policy first.

name: Build installers

on:
  push:
    branches: [main]
    # A tag is what makes a build a RELEASE: it gets published to GitHub Releases, where the
    # installed apps look for updates. Bump "version" in package.json, tag it v<that>, push the
    # tag. Ordinary pushes to main still build and still upload artifacts, they just do not
    # publish — so most commits never reach the partner, which is the point.
    tags: ["v*"]
  # so a build can be kicked off from the Actions tab without pushing anything
  workflow_dispatch:

# electron-builder needs this to create the release and upload to it.
permissions:
  contents: write

jobs:
  build:
    strategy:
      # one broken platform should still leave the other installer downloadable
      fail-fast: false
      # ONE AT A TIME, and only because of publishing. Run the two in parallel and both jobs
      # reach GitHub at the same moment, each finds no release for this tag, and each creates
      # its own — two releases for v0.1.1, one holding the .dmg and the other the .exe, neither
      # complete. Serialised, the first creates the release and the second finds it and uploads
      # into it. Costs about two extra minutes per build and removes the race entirely.
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: flipkart-autofill

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: flipkart-autofill/package-lock.json

      - run: npm ci

      # The same two gates that run locally. A red typecheck must not reach the partner's laptop
      # as a working installer.
      - run: npm run typecheck
      - run: npm run typecheck:gui
      - run: npm test

      # `--publish always` on a tag uploads the installers AND the latest.yml/latest-mac.yml that
      # electron-updater reads to decide an update exists. Publishing the installer without those
      # files produces a release nobody's app ever notices, which is the classic way to think
      # auto-update is broken when it was simply never told about the new version.
      - run: npm run app:dist -- --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # electron-builder tries to sign and notarize on macOS otherwise, which needs an Apple
          # certificate we do not have. Unsigned is the deliberate choice for now.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # sharp is a compiled .node binary and the OS loader cannot open one from inside app.asar.
      # electron-builder.yml unpacks it, but a silent failure here produces an installer that
      # launches, shows the UI, and dies on the first image — the one failure no test catches.
      # Fail the build instead, where it costs nothing.
      - name: sharp must be unpacked, not sealed in the asar
        shell: bash
        run: |
          set -e
          unpacked=$(find dist -type d -name "app.asar.unpacked" | head -1)
          if [ -z "$unpacked" ]; then
            echo "::error::no app.asar.unpacked — asarUnpack did not run"
            find dist -maxdepth 3 -name "*.asar*" || true
            exit 1
          fi
          echo "unpacked at: $unpacked"
          if ! find "$unpacked" -name "*.node" | grep -q .; then
            echo "::error::no .node binary outside the asar — sharp would fail on the first image"
            find "$unpacked" -maxdepth 4 -type d || true
            exit 1
          fi
          echo "native binaries shipped outside the asar:"
          find "$unpacked" -name "*.node"

      # The prompts and the category defaults are read at runtime but built by nobody, so they
      # reach the installer only via extraResources. Missing, the prompt panels show "couldn't
      # read PROMPT-*.md" and — worse, because it is silent — loadProduct() merges no defaults and
      # fills a listing with fields quietly blank. Neither is reproducible on a dev machine, where
      # both folders resolve inside the repo. This is the only gate that can catch it.
      - name: the prompts and category defaults must be in the installer
        shell: bash
        run: |
          set -e
          for f in docs/guides/PROMPT-meta.md categories/balloon-decoration.defaults.json; do
            found=$(find dist -ipath "*resources/$f" | head -1)
            if [ -z "$found" ]; then
              echo "::error::$f is not in the package — extraResources did not ship it"
              find dist -ipath "*resources*" -maxdepth 5 -type d || true
              exit 1
            fi
            echo "shipped: $found"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: wishworks-${{ matrix.name }}
          path: |
            flipkart-autofill/dist/*.exe
            flipkart-autofill/dist/*.dmg
          if-no-files-found: error
